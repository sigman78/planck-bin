name = "planck-bin"
main = "src/worker/index.ts"
compatibility_date = "2026-03-20"
compatibility_flags = ["nodejs_compat", "assets_navigation_has_no_effect"]

# Uncomment to use a custom domain
# routes = [
#   { pattern = "haste.example.com", custom_domain = true }
# ]

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "haste-db"
database_id = "00000000-0000-0000-0000-000000000000" # Placeholder for local dev - run: wrangler d1 create haste-db for production

# Nightly cleanup of expired documents
[triggers]
crons = ["17 3 * * *"]

# Assets binding for serving static files
[assets]
not_found_handling = "single-page-application"
directory = "./dist/client"
binding = "ASSETS"

# Environment variables
[vars]
MAX_PASTE_SIZE = "400000"
KEY_LENGTH = "10"
KEY_STRATEGY = "pronounceable"             # pronounceable | random | uuid
DEFAULT_EXPIRE_DAYS = "30"
BROWSER_CACHE_MAX_AGE = "3600"        # browser Cache-Control max-age in seconds (capped at paste expiry); "0" to disable
SERVER_RENDER = "true"                # render paste pages on the worker; "false" = client-only rendering
COUNT_VIEWS = "false"                 # "true" = count views in D1 (one database write per paste read)
MAX_STORAGE_MB = "0"                  # refuse new pastes (507) once the database reaches this size; "0" = no limit

# Coarse abuse protection. Namespace IDs only need to be unique within this account.
[[ratelimits]]
name = "CREATE_RATE_LIMITER"
namespace_id = "81234001"

  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "READ_RATE_LIMITER"
namespace_id = "81234002"

  [ratelimits.simple]
  limit = 300
  period = 60
