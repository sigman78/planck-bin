<!DOCTYPE html>
<!-- Inline background (= --color-bg) and sizes keep a frame painted before the stylesheet dark and small. -->
<html lang="en" style="background: #002b36">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Planck Bin</title>

		<link rel="stylesheet" type="text/css" href="./solarized_dark.css" />
		<link rel="stylesheet" type="text/css" href="./application.css" />
		<link rel="stylesheet" type="text/css" href="./view-transitions.css" />
		<link rel="stylesheet" type="text/css" href="./island.css" />

		<link rel="icon" href="./favicon.ico" />

		<meta name="robots" content="noindex,nofollow" />

		<script type="module" src="./application.ts"></script>
	</head>

	<body>
		<div id="progress-bar"></div>
		<div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
		<div id="island" class="no-print" style="visibility: hidden">
			<div class="island-hint">
				<!-- Save sits right of everything that expands on hover, so it never slides away from the pointer. -->
				<span class="island-text island-slide" aria-hidden="true">commands</span>
				<kbd class="island-kc island-slide" aria-hidden="true">Ctrl /</kbd>
				<button type="button" class="island-save island-slide" disabled aria-hidden="true">Save</button>
				<button type="button" class="island-trigger" aria-label="Commands (Ctrl+/)" aria-haspopup="listbox" aria-expanded="false">
					<svg class="island-mark" width="14" height="16" viewBox="0 0 14 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
						<path d="M5.6 1.2 L2.4 14.8" />
						<path d="M3.5 10.2 C4.9 7.6 7.2 6.6 9 7.2 C10.4 7.7 10.3 8.9 9.9 10.4 L8.9 14.8" />
						<path d="M1.8 5.2 L7.6 3.4" />
					</svg>
				</button>
			</div>
			<div class="island-panel">
				<div class="island-search">
					<span class="island-crumb" hidden></span>
					<input class="island-input" type="text" role="combobox" aria-label="Command" aria-controls="island-list" aria-expanded="false" aria-autocomplete="list" autocomplete="off" spellcheck="false" />
				</div>
				<div id="island-list" class="island-list" role="listbox" aria-label="Commands"></div>
			</div>
			<!-- Questions (burn reveal, passphrase): the pill morphs into this; the app fills it in. -->
			<div class="island-prompt" role="alertdialog" aria-labelledby="island-prompt-title" aria-describedby="island-prompt-text">
				<p class="island-prompt-title" id="island-prompt-title">Burn after reading</p>
				<p class="island-prompt-text" id="island-prompt-text">This paste can be read once. Opening it deletes it from the server for good.</p>
				<p class="island-prompt-secret" hidden></p>
				<input class="island-prompt-input" type="text" hidden autocomplete="off" autocapitalize="off" spellcheck="false" />
				<div class="island-prompt-actions">
					<button type="button" class="island-prompt-cancel">New paste</button>
					<button type="button" class="island-prompt-confirm">Open and burn</button>
				</div>
			</div>
		</div>

		<!-- Both views start hidden; the app shows the right one on its first render. -->
		<div id="editor-container">
			<div id="gutter" aria-hidden="true"></div>
			<div id="line-highlight" aria-hidden="true"></div>
			<!-- tabindex lets keyboard users scroll long lines; the server renderer matches this tag exactly. -->
			<pre id="viewer" style="display: none" tabindex="0" role="region" aria-label="Paste content"><code class="hljs"></code></pre>
			<textarea id="editor" spellcheck="false" style="display: none"
				aria-label="Paste content" aria-describedby="editor-help"
				placeholder="Paste your code here..."></textarea>
		</div>
		<p id="editor-help" class="visually-hidden">Tab inserts spaces. Press Escape, then Tab, to move focus out of the editor.</p>
		<div id="drop-overlay" aria-hidden="true">
			<div class="drop-overlay-plaque">Drop file to editor</div>
		</div>
	</body>
</html>
